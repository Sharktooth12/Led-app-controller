name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          unzip -q colbor_pc8_android_v0.3.zip
          cd colbor_pc8_android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: colbor-apk
          path: colbor_pc8_android/app/build/outputs/apk/debug/app-debug.apk
